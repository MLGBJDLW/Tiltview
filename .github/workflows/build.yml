name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Type-level guarantees (strict tsc over lib/ and entrypoints/).
      - name: Typecheck
        run: pnpm compile

      # Pure geometry / actions / storage / DOM-applier regression tests.
      - name: Unit tests
        run: pnpm test

      # Loads the built bundle into a real Chrome and drives it end to end.
      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: End-to-end smoke test
        run: node tests/e2e/smoke.mjs
        env:
          TILTVIEW_CHROME: /usr/bin/google-chrome-stable

      - uses: actions/upload-artifact@v4
        with:
          name: tiltview-chrome-mv3
          path: .output/chrome-mv3/
